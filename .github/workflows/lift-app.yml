name: LIFT app

on:
  push:
    branches: [tape-engine-juce, mini-pi]
  workflow_dispatch:

jobs:
  macos:
    name: macOS universal (Standalone, VST3, AU)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DLIFT_APP_ONLY=ON -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --config Release -j 4 --target LiftApp_Standalone LiftApp_VST3 LiftApp_AU lift_panel_check lift_engine_check lift_resample_check lift_mini_check lift_mini_session
      - name: Test
        run: cd build && ctest --output-on-failure -C Release
      - name: Check architectures
        run: lipo -info build/LiftApp_artefacts/Release/Standalone/LIFT.app/Contents/MacOS/LIFT
      - name: Package
        run: |
          mkdir -p dist
          cp -R build/LiftApp_artefacts/Release/Standalone/LIFT.app dist/
          cp -R build/LiftApp_artefacts/Release/VST3/LIFT.vst3 dist/
          cp -R build/LiftApp_artefacts/Release/AU/LIFT.component dist/
          cp .github/README-mac.txt dist/README.txt
          cd dist && ditto -c -k --sequesterRsrc --keepParent . ../LIFT-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LIFT-macOS
          path: LIFT-macOS.zip

  windows:
    name: Windows x64 (Standalone, VST3)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DLIFT_APP_ONLY=ON
      - name: Build
        run: cmake --build build --config Release --parallel --target LiftApp_Standalone LiftApp_VST3
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/LiftApp_artefacts/Release/Standalone/LIFT.exe dist/
          Copy-Item -Recurse build/LiftApp_artefacts/Release/VST3/LIFT.vst3 dist/
          Compress-Archive -Path dist/* -DestinationPath LIFT-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LIFT-Windows
          path: LIFT-Windows.zip

  linux-arm64-mini:
    name: LIFT Mini, Linux arm64 (Raspberry Pi 4/5)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
          libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev libcurl4-openssl-dev libx11-dev libxext-dev
          libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev xvfb
      - name: Configure
        run: cmake -S . -B build -G Ninja -DLIFT_APP_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target LIFT_Mini lift_mini_check lift_mini_session
      - name: Mini checks
        run: xvfb-run -a build/lift_mini_check_artefacts/Release/lift_mini_check
      - name: Mini scenario book
        run: build/lift_mini_session_artefacts/Release/lift_mini_session tests/mini_recipes/book.txt --chaos-seeds 20
      - name: Headless frame
        run: xvfb-run -a build/LIFT_Mini_artefacts/Release/lift-mini --screenshot mini-pi-ui.png --size 800x480
      - name: Package
        run: |
          mkdir -p dist && cp build/LIFT_Mini_artefacts/Release/lift-mini dist/
          cp mini/pi/lift-mini.service mini/pi/controls.example.json mini/README-pi.md mini-pi-ui.png dist/
          tar czf LIFT-Mini-linux-arm64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: LIFT-Mini-linux-arm64
          path: LIFT-Mini-linux-arm64.tar.gz
